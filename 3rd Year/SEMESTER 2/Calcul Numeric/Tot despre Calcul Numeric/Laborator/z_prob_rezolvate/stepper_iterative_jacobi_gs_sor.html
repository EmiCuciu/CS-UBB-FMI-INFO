
<h2 class="sr-only">Metode iterative sisteme liniare — Jacobi, Gauss-Seidel, SOR</h2>
<style>
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}

.leg{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}

<script>
var J=[
  {d:"Sistem: A=[4,−1,0;−1,4,−1;0,−1,4], b=[3,2,3], x*=[1,1,1]. Start: x⁽⁰⁾=[0,0,0].",
   f:"Descompunere: A = D − L − U,  M=D,  N=L+U\nT_J = D⁻¹(L+U),   ρ(T_J) = √2/4 ≈ 0.354 < 1  ✓ converge",
   p:[0,0,0],c:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=1, i=1: Nu avem valori noi disponibile (j<1 vid). Identic cu GS la primul component.",
   f:"x₁⁽¹⁾ = (b₁ − a₁₂·x₂⁽⁰⁾ − a₁₃·x₃⁽⁰⁾) / a₁₁\n       = (3 − (−1)·0 − 0·0) / 4 = 3/4 = 0.75",
   p:[0,0,0],c:[null,null,null],ph:[0,1,1],ch:0},
  {d:"k=1, i=2: ⚠ Jacobi folosește x₁⁽⁰⁾=0 (VECHI)! Nu x₁⁽¹⁾=0.75 — acesta e diferența față de GS.",
   f:"x₂⁽¹⁾ = (b₂ − a₂₁·x₁⁽⁰⁾ − a₂₃·x₃⁽⁰⁾) / a₂₂\n       = (2 − (−1)·0 − (−1)·0) / 4 = 0.5\n              ↑ x₁⁽⁰⁾=0 (VECHI), NU x₁⁽¹⁾=0.75!",
   p:[0,0,0],c:[0.75,null,null],ph:[1,0,1],ch:1},
  {d:"k=1, i=3: Calculăm x₃⁽¹⁾ din x₁⁽⁰⁾=0 și x₂⁽⁰⁾=0 (ambele vechi).",
   f:"x₃⁽¹⁾ = (b₃ − a₃₁·x₁⁽⁰⁾ − a₃₂·x₂⁽⁰⁾) / a₃₃\n       = (3 − 0·0 − (−1)·0) / 4 = 0.75",
   p:[0,0,0],c:[0.75,0.5,null],ph:[1,1,0],ch:2},
  {d:"k=1 complet. SUBSTITUȚIE SIMULTANĂ — toate din x⁽⁰⁾.",
   f:"x⁽¹⁾ = [0.75, 0.5, 0.75]\n‖x*−x⁽¹⁾‖∞ = max{0.25, 0.5, 0.25} = 0.5",
   p:[0.75,0.5,0.75],c:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=2, i=1: Folosim x₂⁽¹⁾=0.5 și x₃⁽¹⁾=0.75 (valorile VECHI din k=1).",
   f:"x₁⁽²⁾ = (3 − (−1)·0.5 − 0·0.75) / 4 = 3.5/4 = 0.875",
   p:[0.75,0.5,0.75],c:[null,null,null],ph:[0,1,1],ch:0},
  {d:"k=2, i=2: Folosim x₁⁽¹⁾=0.75 și x₃⁽¹⁾=0.75 (VECHI).",
   f:"x₂⁽²⁾ = (2 − (−1)·0.75 − (−1)·0.75) / 4 = (2+1.5)/4 = 0.875",
   p:[0.75,0.5,0.75],c:[0.875,null,null],ph:[1,0,1],ch:1},
  {d:"k=2, i=3: Calculăm x₃⁽²⁾.",
   f:"x₃⁽²⁾ = (3 − 0·0.75 − (−1)·0.5) / 4 = 3.5/4 = 0.875",
   p:[0.75,0.5,0.75],c:[0.875,0.875,null],ph:[1,1,0],ch:2},
  {d:"k=2 complet. Convergență lentă și uniformă. Comparativ: GS → 0.078, SOR(1.2) → 0.069.",
   f:"x⁽²⁾ = [0.875, 0.875, 0.875]\n‖x*−x⁽²⁾‖∞ = 0.125  (față de 0.5 la k=1)\n~10 iterații pentru ‖err‖ < 10⁻⁴",
   p:[0.875,0.875,0.875],c:[null,null,null],ph:[0,0,0],ch:-1}
];

var GS=[
  {d:"x⁽⁰⁾=[0,0,0]. GS: x_i⁽ᵏ⁾ calculat folosește IMEDIAT x_j⁽ᵏ⁾ (j<i) deja actualizate.",
   f:"x_i⁽ᵏ⁾ = (b_i − Σ_{j<i} a_{ij}·x_j⁽ᵏ⁾ − Σ_{j>i} a_{ij}·x_j⁽ᵏ⁻¹⁾) / a_{ii}\n                       ↑ NOI (k)                     ↑ VECHI (k-1)",
   p:[0,0,0],c:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=1, i=1: Nicio valoare din k disponibilă. Identic cu Jacobi la primul component.",
   f:"x₁⁽¹⁾ = (3 − (−1)·0 − 0·0) / 4 = 0.75",
   p:[0,0,0],c:[null,null,null],ph:[0,1,1],ch:0},
  {d:"k=1, i=2: ★ DIFERENȚA CHEIE — GS folosește x₁⁽¹⁾=0.75 (NOU), nu x₁⁽⁰⁾=0!",
   f:"x₂⁽¹⁾ = (b₂ − a₂₁·x₁⁽ᵏ⁾ − a₂₃·x₃⁽⁰⁾) / a₂₂\n       = (2 − (−1)·0.75 − (−1)·0) / 4\n                      ↑ NOU! (0.75)        ↑ VECHI (0)\n       = (2 + 0.75) / 4 = 0.6875   vs Jacobi: 0.5",
   p:[0,0,0],c:[0.75,null,null],ph:[0,0,1],ch:1},
  {d:"k=1, i=3: Folosim x₁⁽¹⁾=0.75 și x₂⁽¹⁾=0.6875 (ambele NOI din iterația curentă).",
   f:"x₃⁽¹⁾ = (3 − 0·x₁⁽¹⁾ − (−1)·x₂⁽¹⁾) / 4\n       = (3 + 0.6875) / 4 = 0.9219   vs Jacobi: 0.75",
   p:[0,0,0],c:[0.75,0.6875,null],ph:[0,0,0],ch:2},
  {d:"k=1 complet. GS mult mai rapid: x₃⁽¹⁾=0.922 față de 0.75 la Jacobi!",
   f:"x⁽¹⁾ = [0.75, 0.6875, 0.9219]\n‖x*−x⁽¹⁾‖∞ = 0.312   (Jacobi: 0.5  — GS mai bun!)",
   p:[0.75,0.6875,0.9219],c:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=2, i=1: x₂⁽¹⁾=0.6875 (VECHI — x₂⁽²⁾ nu există încă) și x₃⁽¹⁾=0.9219 (VECHI).",
   f:"x₁⁽²⁾ = (3 − (−1)·0.6875 − 0·0.9219) / 4 = 3.6875/4 = 0.9219",
   p:[0.75,0.6875,0.9219],c:[null,null,null],ph:[0,1,1],ch:0},
  {d:"k=2, i=2: x₁⁽²⁾=0.9219 (NOU) și x₃⁽¹⁾=0.9219 (VECHI din k=1).",
   f:"x₂⁽²⁾ = (2 − (−1)·0.9219 − (−1)·0.9219) / 4\n       = (2 + 0.9219 + 0.9219) / 4 = 0.9609",
   p:[0.75,0.6875,0.9219],c:[0.9219,null,null],ph:[0,0,1],ch:1},
  {d:"k=2, i=3: x₂⁽²⁾=0.9609 (NOU). (a₃₁=0 deci x₁ nu intervine.)",
   f:"x₃⁽²⁾ = (3 − 0 − (−1)·0.9609) / 4 = (3+0.9609)/4 = 0.9902",
   p:[0.75,0.6875,0.9219],c:[0.9219,0.9609,null],ph:[0,0,0],ch:2},
  {d:"k=2 complet. GS ~3× mai rapid decât Jacobi!",
   f:"x⁽²⁾ = [0.9219, 0.9609, 0.9902]\n‖x*−x⁽²⁾‖∞ = 0.078   (Jacobi: 0.125  — GS mai rapid!)\nPentru D.D.: ρ(T_GS) ≤ ρ(T_J)² ≈ 0.125",
   p:[0.9219,0.9609,0.9902],c:[null,null,null],ph:[0,0,0],ch:-1}
];

var SOR=[
  {d:"x⁽⁰⁾=[0,0,0], ω=1.2 (suprarelaxare). SOR = medie ponderată ω între GS și valoarea veche.",
   f:"x_i⁽ᵏ⁾ = (1−ω)·x_i⁽ᵏ⁻¹⁾ + (ω/a_{ii})·(b_i − Σ_{j<i} a_{ij}·x_j⁽ᵏ⁾ − Σ_{j>i} a_{ij}·x_j⁽ᵏ⁻¹⁾)\n\nω=1 → GS  |  ω<1 subrelaxare  |  ω>1 suprarelaxare\nω_opt = 2/(1+√(1−ρ_J²)) ≈ 1.034  (pentru acest sistem)",
   p:[0,0,0],c:[null,null,null],gs:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=1, i=1: Calculăm x₁_GS (formula GS), apoi relaxăm cu ω=1.2.",
   f:"x₁_GS = (3 − 0 − 0) / 4 = 0.75\nx₁⁽¹⁾   = (1−1.2)·x₁⁽⁰⁾ + 1.2·x₁_GS\n        = (−0.2)·0 + 1.2·0.75 = 0.9   ← dincolo de GS (0.75)!",
   p:[0,0,0],c:[null,null,null],gs:[0.75,null,null],ph:[0,1,1],ch:0},
  {d:"k=1, i=2: Folosim x₁⁽¹⁾=0.9 (NOU după SOR). Calculăm x₂_GS, relaxăm.",
   f:"x₂_GS = (2 − (−1)·0.9 − 0) / 4 = 2.9/4 = 0.725\nx₂⁽¹⁾   = (1−1.2)·0 + 1.2·0.725 = 0.87   ← vs GS: 0.6875",
   p:[0,0,0],c:[0.9,null,null],gs:[0.75,0.725,null],ph:[0,0,1],ch:1},
  {d:"k=1, i=3: Suprarelaxare → x₃ depășește soluția (overshoot). Normal pentru ω > ω_opt.",
   f:"x₃_GS = (3 − 0 − (−1)·0.87) / 4 = 3.87/4 = 0.9675\nx₃⁽¹⁾   = (1−1.2)·0 + 1.2·0.9675 = 1.161   ← OVERSHOOT (>1)!\nSe corectează în iterațiile următoare.",
   p:[0,0,0],c:[0.9,0.87,null],gs:[0.75,0.725,0.9675],ph:[0,0,0],ch:2},
  {d:"k=1 complet. SOR mai rapid dacă ω bine ales.",
   f:"x⁽¹⁾ = [0.9, 0.87, 1.161]\n‖x*−x⁽¹⁾‖∞ = 0.161   (GS: 0.312, Jacobi: 0.5)\nω=1.2 ≈ ω_opt=1.034 → oscilații mici.",
   p:[0.9,0.87,1.161],c:[null,null,null],gs:[null,null,null],ph:[0,0,0],ch:-1},
  {d:"k=2, i=1: Blendăm x₁_GS cu x₁⁽¹⁾=0.9 (vechi).",
   f:"x₁_GS = (3 − (−1)·0.87 − 0) / 4 = 3.87/4 = 0.9675\nx₁⁽²⁾   = (1−1.2)·0.9 + 1.2·0.9675 = −0.18 + 1.161 = 0.981",
   p:[0.9,0.87,1.161],c:[null,null,null],gs:[0.9675,null,null],ph:[0,1,1],ch:0},
  {d:"k=2, i=2: x₁⁽²⁾=0.981 (NOU) și x₃⁽¹⁾=1.161 (VECHI).",
   f:"x₂_GS = (2 − (−1)·0.981 − (−1)·1.161) / 4 = 4.142/4 = 1.036\nx₂⁽²⁾   = (1−1.2)·0.87 + 1.2·1.036 = −0.174 + 1.243 = 1.069",
   p:[0.9,0.87,1.161],c:[0.981,null,null],gs:[0.9675,1.036,null],ph:[0,0,1],ch:1},
  {d:"k=2, i=3: x₂⁽²⁾=1.069 (NOU). Overshoot se corectează progresiv.",
   f:"x₃_GS = (3 − 0 − (−1)·1.069) / 4 = 4.069/4 = 1.017\nx₃⁽²⁾   = (1−1.2)·1.161 + 1.2·1.017 = −0.232 + 1.221 = 0.988",
   p:[0.9,0.87,1.161],c:[0.981,1.069,null],gs:[0.9675,1.036,1.017],ph:[0,0,0],ch:2},
  {d:"k=2 complet. Cu ω=ω_opt≈1.034 convergența ar fi optimă.",
   f:"x⁽²⁾ = [0.981, 1.069, 0.988]\n‖x*−x⁽²⁾‖∞ = 0.069\nω_opt = 2/(1+√(1−ρ_J²)) ≈ 1.034\nCu ω_opt: convergent mai rapid decât GS pentru orice x⁽⁰⁾",
   p:[0.981,1.069,0.988],c:[null,null,null],gs:[null,null,null],ph:[0,0,0],ch:-1}
];

var METHODS=[
  {name:"Comparație",steps:null},
  {name:"Jacobi",badge:"Substituție simultană",bc:"bg",
   idea:"Toate x_i⁽ᵏ⁾ se calculează SIMULTAN din valorile x⁽ᵏ⁻¹⁾. Nici o valoare nouă nu se folosește înainte de a termina iterația. M=D, N=L+U.",
   steps:J,isSOR:false},
  {name:"Gauss-Seidel",badge:"Substituție secvențială",bc:"bg",
   idea:"x_i⁽ᵏ⁾ folosește imediat x_j⁽ᵏ⁾ (j<i) deja actualizate. Mai rapid decât Jacobi: ρ(T_GS)≤ρ(T_J)² pentru matrice diagonal-dominante. M=D−L, N=U.",
   steps:GS,isSOR:false},
  {name:"SOR (ω)",badge:"Suprarelaxare succesivă",bc:"bp",
   idea:"SOR = medie ponderată ω: x_i = (1−ω)x_i⁽ᵒˡᵈ⁾ + ω·x_i⁽ᴳˢ⁾. Parametrul ω∈(0,2) accelerează sau stabilizează. Optim: ω_opt=2/(1+√(1−ρ_J²)).",
   steps:SOR,isSOR:true}
];

var cM=0,cS=0;

function fmt(v){
  if(v===null)return '—';
  if(typeof v==='string')return v;
  return v.toFixed(4);
}

function renderVec(s,isSOR){
  var lb=['x₁','x₂','x₃'];
  var h='<table class="vt"><thead><tr><th style="border:none;padding-right:8px"></th>';
  h+='<th class="vh vh-o">x⁽ᵏ⁻¹⁾  vechi</th>';
  h+='<th class="vh vh-n">x⁽ᵏ⁾  noi</th>';
  if(isSOR)h+='<th class="vh vh-g">x_GS  intermediar</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<3;i++){
    var ph=s.ph[i], isC=s.ch===i;
    var pvCls=ph?'vc vold':'vc';
    var cvCls,cvD;
    if(isC){cvCls='vc vcur';cvD='← calcul...';}
    else if(s.c[i]!==null){cvCls='vc vnew';cvD=fmt(s.c[i]);}
    else{cvCls='vc vtod';cvD='—';}
    h+='<tr><td class="vl">'+lb[i]+'</td><td class="'+pvCls+'">'+fmt(s.p[i])+'</td><td class="'+cvCls+'">'+cvD+'</td>';
    if(isSOR){
      var gv=s.gs[i], gCls, gD;
      if(isC){gCls='vc vcur';gD='← calcul...';}
      else if(gv!==null){gCls='vc vgs';gD=fmt(gv);}
      else{gCls='vc vtod';gD='—';}
      h+='<td class="'+gCls+'">'+gD+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table>';
}

function cmpHTML(){
  return '<div style="margin-bottom:10px"><div class="mn">Metode iterative stationare pentru Ax=b</div><div class="idea">A=M−N → x⁽ᵏ⁺¹⁾=Tx⁽ᵏ⁾+c cu T=M⁻¹N, c=M⁻¹b. Converge ⟺ ρ(T)&lt;1. Sistem exemplu: A=[4,−1,0;−1,4,−1;0,−1,4], b=[3,2,3], x*=[1,1,1].</div></div>'
  +'<table class="ct"><thead><tr><th>Proprietate</th><th>Jacobi</th><th>Gauss-Seidel</th><th>SOR</th></tr></thead><tbody>'
  +'<tr><td>Descompunere</td><td><code>M=D, N=L+U</code></td><td><code>M=D−L, N=U</code></td><td><code>M=D/ω−L</code></td></tr>'
  +'<tr><td>Matrice iterație T</td><td><code>D⁻¹(L+U)</code></td><td><code>(D−L)⁻¹U</code></td><td><code>(D−ωL)⁻¹((1−ω)D+ωU)</code></td></tr>'
  +'<tr><td>Valori folosite la x_i</td><td>TOATE din k−1</td><td>j&lt;i: noi (k); j&gt;i: vechi (k−1)</td><td>Ca GS, ponderat cu ω</td></tr>'
  +'<tr><td>Convergență (suf.)</td><td>diagonal-dominant</td><td>D.D. sau SPD</td><td>0&lt;ω&lt;2 (nec.); A SPD (suf.)</td></tr>'
  +'<tr><td>Viteza de convergență</td><td>baza</td><td>ρ_GS ≤ ρ_J²  (~2× mai rapid)</td><td>optim cu ω_opt; Kahan: ρ(Tω)≥|ω−1|</td></tr>'
  +'<tr><td>Parametru liber</td><td>—</td><td>—</td><td>ω∈(0,2);  ω_opt=2/(1+√(1−ρ_J²))</td></tr>'
  +'<tr><td>‖err‖∞ la k=2</td><td><span class="no">0.125</span></td><td>0.078</td><td><span class="ok">0.069</span> (ω=1.2)</td></tr>'
  +'<tr><td>Criteriu oprire</td><td colspan="3" style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-secondary)">‖x⁽ᵏ⁾−x⁽ᵏ⁻¹⁾‖ ≤ ε  (practic)  &nbsp;|&nbsp;  ‖x⁽ᵏ⁾−x⁽ᵏ⁻¹⁾‖ ≤ (1−‖T‖)/‖T‖·ε  (teoretic)</td></tr>'
  +'</tbody></table>';
}

function renderStep(){
  var m=METHODS[cM];
  if(cM===0){
    document.getElementById('C').innerHTML=cmpHTML();
    document.getElementById('NV').style.display='none';
    return;
  }
  var s=m.steps[cS];
  var h='<div class="mn">'+m.name+'</div>';
  h+='<span class="bdg '+m.bc+'">'+m.badge+'</span>';
  h+='<div class="idea">'+m.idea+'</div>';
  h+='<div class="leg">';
  h+='<div class="li"><div class="lc" style="background:#FAC775"></div>valoare veche referintă</div>';
  h+='<div class="li"><div class="lc" style="background:#9FE1CB"></div>valoare nouă calculată</div>';
  h+='<div class="li"><div class="lc" style="background:#CECBF6"></div>se calculează acum</div>';
  h+='<div class="li"><div class="lc" style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary)"></div>în așteptare</div>';
  if(m.isSOR)h+='<div class="li"><div class="lc" style="background:#85B7EB"></div>intermediar GS</div>';
  h+='</div>';
  h+='<div class="sd">'+s.d+'</div>';
  h+='<div class="fb">'+s.f+'</div>';
  h+=renderVec(s,m.isSOR);
  document.getElementById('C').innerHTML=h;
  document.getElementById('NV').style.display='flex';
  document.getElementById('SC').textContent='Pas '+(cS+1)+' / '+m.steps.length;
  document.getElementById('PB').disabled=(cS===0);
  document.getElementById('NB').disabled=(cS===m.steps.length-1);
}

function render(){
  document.getElementById('T').innerHTML=METHODS.map(function(mm,i){
    return '<button class="tb'+(i===cM?' on':'')+'" onclick="setTab('+i+')">'+mm.name+'</button>';
  }).join('');
  renderStep();
}

function go(d){
  var m=METHODS[cM];
  if(!m.steps)return;
  cS=Math.max(0,Math.min(m.steps.length-1,cS+d));
  renderStep();
}

function setTab(i){cM=i;cS=0;render();}
render();
</script>
